<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview de Etiquetas SAP (100x50 mm)</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
        }
        .header {
            background: white;
            padding: 20px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-badge {
            display: inline-flex;
            gap: 12px;
            align-items: center;
            background: #eff6ff;
            color: #1e40af;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }
        .search-box {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            background: var(--primary);
            color: white;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .grid-etiquetas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }
        /* Layout Físico da Etiqueta (proporção 100x50 mm) */
        .etiqueta {
            width: 100%;
            aspect-ratio: 2 / 1;
            background: white;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.06);
            position: relative;
            box-sizing: border-box;
        }
        .etiq-header {
            font-size: 10px;
            font-weight: 700;
            border-bottom: 1px solid #000;
            padding-bottom: 4px;
            color: #111;
            text-transform: uppercase;
        }
        .etiq-body {
            margin-top: 4px;
        }
        .etiq-code {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .etiq-desc {
            font-size: 11px;
            font-weight: 600;
            color: #222;
            line-height: 1.25;
            margin-top: 3px;
            height: 28px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .etiq-barcode {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0;
        }
        .etiq-barcode svg {
            width: 85%;
            height: 38px;
        }
        .etiq-barcode-text {
            font-size: 9px;
            font-family: monospace;
            font-weight: bold;
            margin-top: 1px;
            letter-spacing: 1px;
        }
        .etiq-footer {
            border-top: 1px solid #000;
            padding-top: 4px;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .etiq-footer-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .etiq-qtd {
            font-size: 12px;
            font-weight: 800;
        }
        .etiq-sub {
            font-size: 9px;
            color: #444;
        }

        /* Regras para Impressão em Folha / Bobina */
        @media print {
            body {
                padding: 0;
                background: white;
            }
            .header, .controls {
                display: none !important;
            }
            .grid-etiquetas {
                display: block !important;
            }
            .etiqueta {
                width: 100mm !important;
                height: 50mm !important;
                page-break-after: always;
                border: 1px solid #000 !important;
                box-shadow: none !important;
                margin: 0 auto;
            }
            @page {
                size: 100mm 50mm;
                margin: 0;
            }
        }
    </style>
</head>

        // Gerador SVG Code 128 B Minimalista e 100% Autônomo
        function gerarSVGCode128(text) {
            // Tabela de padrões Code 128
            const patterns = [
                "212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213",
                "221312", "231212", "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132",
                "221231", "213212", "223112", "312131", "311222", "321122", "321221", "312212", "322112", "322211",
                "212123", "212321", "232121", "111323", "131123", "131321", "112313", "132113", "132311", "211313",
                "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121", "313121", "211331",
                "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111",
                "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214",
                "112412", "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111",
                "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211", "212141",
                "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113", "411311", "113141",
                "114131", "311141", "411131", "211412", "211214", "211232", "2331112"
            ];
            
            // Subconjunto B Code 128: Start Code B = 104
            let codes = [104];
            let checkSum = 104;
            for (let i = 0; i < text.length; i++) {
                let c = text.charCodeAt(i) - 32;
                if (c < 0 || c > 95) c = 0;
                codes.push(c);
                checkSum += c * (i + 1);
            }
            codes.push(checkSum % 103);
            codes.push(106); // Stop Code

            // Monta os módulos (barras e espaços)
            let modules = "";
            codes.forEach(c => {
                let p = patterns[c];
                let isBar = true;
                for (let j = 0; j < p.length; j++) {
                    let width = parseInt(p[j]);
                    modules += (isBar ? "1" : "0").repeat(width);
                    isBar = !isBar;
                }
            });

            // Gera os retângulos SVG
            let svgBars = "";
            let currentX = 10;
            let barW = 1.35;
            for (let i = 0; i < modules.length; i++) {
                if (modules[i] === "1") {
                    svgBars += `<rect x="${(currentX + i * barW).toFixed(2)}" y="0" width="${barW}" height="36" fill="black" />`;
                }
            }
            let totalW = currentX * 2 + modules.length * barW;
            return `<svg viewBox="0 0 ${totalW} 36" preserveAspectRatio="none">${svgBars}</svg>`;
        }

        function renderizar(itens) {
            grid.innerHTML = '';
            const dataHoje = "24/10/2026";
            itens.forEach(reg => {
                const el = document.createElement('div');
                el.className = 'etiqueta';
                el.innerHTML = `
                    <div class="etiq-header">
                        CENTRO: ${reg.centro} &nbsp;|&nbsp; DEP: ${reg.deposito} - ${reg.desc_deposito}
                    </div>
                    <div class="etiq-body">
                        <div class="etiq-code">CÓD: ${reg.material}</div>
                        <div class="etiq-desc">DESC: ${reg.texto_breve}</div>
                        <div class="etiq-barcode">
                            ${gerarSVGCode128(reg.codigo_barras)}
                            <div class="etiq-barcode-text">${reg.codigo_barras}</div>
                        </div>
                    </div>
                    <div class="etiq-footer">
                        <div class="etiq-footer-col">
                            <div class="etiq-qtd">QTD: ${reg.qtd_formatada} ${reg.um}</div>
                            <div class="etiq-sub">VALOR: R$ ${reg.valor_livre}</div>
                        </div>
                        <div class="etiq-footer-col" style="text-align: right;">
                            <div class="etiq-sub" style="font-weight:bold;">GRP: ${reg.grupo_merc}</div>
                            <div class="etiq-sub">DATA: ${dataHoje}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(el);
            });
            badgeVisiveis.textContent = `Visíveis: ${itens.length}`;
        }

        filtro.addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            if (!termo) {
                renderizar(registros);
                return;
            }
            const filtrados = registros.filter(r => 
                r.material.toLowerCase().includes(termo) ||
                r.texto_breve.toLowerCase().includes(termo) ||
                r.um.toLowerCase().includes(termo) ||
                r.grupo_merc.toLowerCase().includes(termo) ||
                r.desc_deposito.toLowerCase().includes(termo)
            );
            renderizar(filtrados);
        });

        // Render inicial
        renderizar(registros);
    </script>
